# Rollen und Fachbereiche aus dem Hackathon-Briefing ("Eure Jury" und "Stimmen aus dem Unternehmen").
# Die Rolle ist eine Benutzerperspektive, keine Rechteverwaltung.
# Die Zuordnung Fachbereich -> Daten (systems / sheets / fields / categories) ist ein
# Vorschlag und kann hier angepasst werden. Ein Befund gehört zu einem Fachbereich,
# wenn mindestens eines der Kriterien passt.

roles:
  CEO:
    person: Kevin
    title: CEO
    focus: "Wo stehen wir, wo ist es am dringendsten, wer packt was zuerst an und woran merken wir, dass es wirkt."
  Head of MDM:
    person: Norbert
    title: Head of MDM
    focus: "Flexible, zukunftssichere Werkzeuge; Fachabteilungen sollen Datenqualität selbst bewerten und verbessern."
  Domain Expert:
    person: Mike
    title: Domain Expert DQ
    focus: "Wo schadet schlechte Datenqualität, Ursache und Folgefehler verbinden, nachvollziehbarer Score."
  Head of Data Governance:
    person: Lukas
    title: Head of Data Governance
    focus: "Wie hängen die Daten über Systeme hinweg zusammen, welches System ist maßgeblich, wer verantwortet was."
  Head of AI:
    person: Moritz
    title: Head of AI
    focus: "Wie wurde KI eingesetzt, wie entsteht die Befundliste nachvollziehbar, funktioniert das Tool auch mit neuen Daten."

# Fachbereiche der Domain Experts (Stimmen aus dem Unternehmen)
